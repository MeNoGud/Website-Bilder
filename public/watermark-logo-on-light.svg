<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="2400" viewBox="0 0 2400 2400">
  <defs>
    <!-- Monochrome dark mark for pale / white backgrounds -->
    <filter id="mono-dark" color-interpolation-filters="sRGB">
      <!-- Luminance to gray, scale alpha (~12%) for light backgrounds -->
      <feColorMatrix
        type="matrix"
        values="0.2126 0.7152 0.0722 0 0
                0.2126 0.7152 0.0722 0 0
                0.2126 0.7152 0.0722 0 0
                0 0 0 0.12 0"
      />
    </filter>
  </defs>
  <image
    xlink:href="logo.svg"
    href="logo.svg"
    x="600"
    y="600"
    width="1200"
    height="1200"
    filter="url(#mono-dark)"
    preserveAspectRatio="xMidYMid meet"
  />
</svg>
